############################
# VARIABLES GLOBALES
############################
variables:
  GIT_DEPTH: "1"
  SONAR_HOST_URL: "http://192.168.168.129:9000"
  REGISTRY_URL: "192.168.168.129:5050"
  MAVEN_CLI_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository --batch-mode"
  DOCKER_DRIVER: overlay2
  

############################
# CACHE
############################
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - frontend/node_modules/

############################
# STAGES
############################
stages:
  - build-shared
  - test-unitaires
  - security-scan
  - docker-build
  - docker-scan

############################
# 1️⃣ INSTALLATION DES MODULES COMMUNS
############################
install-commons:
  stage: build-shared
  image: maven:3.8.5-openjdk-17
  script:
    - cd backend/common-service && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-student && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-exam && mvn install -DskipTests $MAVEN_CLI_OPTS
  when: manual  

############################
# 2️⃣ TESTS BACKEND + JACOCO
############################
backend-tests:
  stage: test-unitaires
  image: maven:3.8.5-openjdk-17
  needs: ["install-commons"]
  script: |
    cd backend
    for service in answer-service api-gateway-service course-service exam-service user-service eureka-service; do
      echo "========== Testing $service =========="
      cd $service
      mvn test $MAVEN_CLI_OPTS -Dspring.profiles.active=test
      cd ..
    done
  artifacts:
    when: always
    paths:
      - backend/**/target/classes
      - backend/**/target/site/jacoco/jacoco.xml
    expire_in: 1 hour
  when: manual  

############################
# 3️⃣ TESTS FRONTEND (ANGULAR)
############################
frontend-tests:
  stage: test-unitaires
  image: node:18-alpine
  script:
    - cd frontend
    - npm install --legacy-peer-deps
    - npm run test -- --coverage --watchAll=false || true
  artifacts:
    when: always
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 hour
  allow_failure: true
  when: manual

############################
# 4️⃣ SONARQUBE BACKEND
############################
sonarqube-backend:
  stage: security-scan
  image: maven:3.8.5-openjdk-17
  needs:
  - job: backend-tests
    artifacts: true
  script: |
    cd backend
    for service in user-service exam-service answer-service course-service api-gateway-service eureka-service; do
      echo "========== Sonar Backend : $service =========="
      cd $service
      mvn verify sonar:sonar $MAVEN_CLI_OPTS \
        -Dsonar.projectKey=$service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.java.binaries=target/classes \
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
        || echo "Sonar failed for $service"
      cd ..
    done
  allow_failure: true
sca-scan-backend:
  stage: security-scan
  image: maven:3.8.5-openjdk-17
  needs: ["backend-tests"]
  script:
    - cd backend
    - |
      for dir in api-gateway-service user-service exam-service course-service answer-service; do
        echo "🔍 Scanning $dir..."
        (
          cd $dir && \
          mvn org.owasp:dependency-check-maven:check \
            $MAVEN_CLI_OPTS \
            -Dformat=HTML \
            -DoutputDirectory=target
        ) || echo "SCA failed for $dir"
      done
  artifacts:
    when: always
    paths:
      - backend/**/target/dependency-check-report.html
  allow_failure: true
  when: manual

############################
# 5️⃣ SONARQUBE FRONTEND
############################
sonar-frontend:
  stage: security-scan
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: ["frontend-tests"]
  script:
    - cd frontend
    - |
      sonar-scanner \
        -Dsonar.projectKey=devsecops-frontend \
        -Dsonar.projectName=devsecops-frontend \
        -Dsonar.projectVersion=$CI_COMMIT_SHORT_SHA \
        -Dsonar.sources=src \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts
  allow_failure: true
sca-scan-frontend:
  stage: security-scan
  image: node:18-alpine
  needs: ["frontend-tests"]
  script:
    - cd frontend
    - echo "SCA Frontend — Analyse des dépendances NPM (npm audit)"
    - npm ci --legacy-peer-deps
    - npm audit --json > npm-audit-report.json || true
    - npm audit > npm-audit-report.txt || true
    - npm audit --production --audit-level=critical
  artifacts:
    when: always
    paths:
      - frontend/npm-audit-report.json
      - frontend/npm-audit-report.txt
    expire_in: 1 week
  allow_failure: true
  when: manual
############################
# 8️⃣ BUILD & PUSH TO REGISTRY (CORRIGÉ)
############################
docker-build-local:
  stage: docker-build
  image: docker:24.0
  services:
    - docker:24.0-dind
      alias:docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_BUILDKIT: "0"  
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $REGISTRY_URL
  script:
    - docker info
    - cd backend
    - |
      for service in answer-service api-gateway-service course-service exam-service user-service eureka-service zuul-service; do
        echo "========== Building Docker image for $service =========="
        docker build -t $REGISTRY/$service:latest ./$service
        docker push $REGISTRY/$service:latest
      done
    - cd ../frontend
    - docker build -t $REGISTRY/frontend:latest .
    - docker push $REGISTRY/frontend:latest
  artifacts:
    paths:
      - "*.tar"
    expire_in: 1 week

############################
# 9️⃣ SCAN DES IMAGES AVEC TRIVY (CORRIGÉ)
############################
container_scan:
  stage: docker-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  needs:
    - docker-build-local  # S'assurer que les images sont pushées

  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - mkdir -p reports/
    - |
      REGISTRY="192.168.168.129:5050/root/devsecops-project"

      for service in answer-service api-gateway-service course-service exam-service user-service eureka-service zuul-service frontend; do
        IMAGE="$REGISTRY/$service:latest"
        echo "🛡️ Scanning $IMAGE from registry..."

        # Scan en HTML
        trivy image $IMAGE \
          --format template --template "@/contrib/html.tpl" \
          --output "reports/${service}-trivy-report.html" \
          --severity HIGH,CRITICAL || echo "HTML scan failed for $service"

        # Scan en JSON
        trivy image $IMAGE \
          --format json \
          --output "reports/${service}-trivy-report.json" \
          --severity HIGH,CRITICAL || echo "JSON scan failed for $service"
      done

  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

  only:
    - main

  