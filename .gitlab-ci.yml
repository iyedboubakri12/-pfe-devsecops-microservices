############################################################
# CONFIGURATION GLOBALE
############################################################
variables:
  GIT_DEPTH: "1"
  SONAR_HOST_URL: "http://192.168.1.200:9000"
  REGISTRY_URL: "registry.gitlab.com"
  MAVEN_CLI_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository --batch-mode"
  DOCKER_DRIVER: overlay2
  # Nom UNIQUE pour DefectDojo (évite les doublons)
  DD_PRODUCT_NAME: "DigitalOcean-App"
  # Ton URL Slack pour le ChatOps
  SLACK_WEBHOOK: "***REMOVED***"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - frontend/node_modules/

stages:
  - build-shared
  - build-all
  - test-unitaires
  - security-scan
  - policy-check 
  - docker-build
  - docker-scan
  - test-security
  - deploy-cloud 
  - dast-scan
  - upload-defectdojo

default:
  image: maven:3.8.5-openjdk-17

############################################################
# 1️⃣ BUILD & UNIT TESTS
############################################################
install-commons:
  stage: build-shared
  tags: [vm]
  script:
    - cd backend/common-service && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-student && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-exam && mvn install -DskipTests $MAVEN_CLI_OPTS

build-all-backend:
  stage: build-all
  tags: [vm]
  needs: ["install-commons"]
  script:
    - cd backend
    - for service in answer-service api-gateway-service course-service exam-service user-service eureka-service ; do cd $service && mvn package -DskipTests $MAVEN_CLI_OPTS && cd ..; done
  artifacts:
    paths: ["backend/*/target/*.jar"]
    expire_in: 1 hour

build-frontend-app:
  stage: build-all
  tags: [vm]
  image: node:18-alpine
  script:
    - cd frontend && npm install --legacy-peer-deps && npm run build -- --configuration production
  artifacts:
    paths: ["frontend/dist/"]

backend-tests:
  stage: test-unitaires
  tags: [vm]
  needs: ["install-commons","build-all-backend"]
  script:
    - cd backend
    - for service in answer-service api-gateway-service course-service exam-service user-service eureka-service; do cd $service && mvn test $MAVEN_CLI_OPTS -Dspring.profiles.active=test && cd ..; done
  artifacts:
    paths: ["backend/**/target/site/jacoco/jacoco.xml"]

############################################################
# 2️⃣ SECURITY SCANS (SAST, SCA, SECRETS, IaC)
############################################################
sonarqube-backend:
  stage: security-scan
  tags: [vm]
  needs: ["backend-tests"]
  script:
    - cd backend
    - for service in user-service exam-service answer-service course-service api-gateway-service eureka-service; do cd $service && mvn verify sonar:sonar $MAVEN_CLI_OPTS -Dsonar.projectKey=$service -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN || true && cd ..; done
  allow_failure: true

sca-scan-backend:
  stage: security-scan
  tags: [vm]
  image: { name: "aquasec/trivy:latest", entrypoint: [""] }
  script:
    - mkdir -p reports
    - cd backend
    - for service in api-gateway-service user-service exam-service course-service answer-service; do trivy fs --format json --output "../reports/${service}-sca.json" --severity HIGH,CRITICAL $service || true; done
  artifacts:
    paths: ["reports/*.json"]

secret-detection:
  stage: security-scan
  tags: [vm]
  image: { name: "zricethezav/gitleaks:latest", entrypoint: [""] }
  script:
    - gitleaks detect --source . --redact --report-format sarif --report-path gl-secret-report.sarif || true
  artifacts:
    paths: ["gl-secret-report.sarif"]

opa-gatekeeper-check:
  stage: policy-check
  tags: [vm]
  image: { name: "openpolicyagent/conftest:latest", entrypoint: [""] }
  script:
    - conftest test k8s/*.yaml -p k8s/kubernetes.rego --output json > opa-report.json || true
  artifacts:
    paths: ["opa-report.json"]

############################################################
# 3️⃣ QWIET AI (ADVANCED SAST & AUTO-FIX READY)
############################################################
qwiet-prezero-scan:
  stage: test-security
  tags: [vm]
  image: ubuntu:latest
  dependencies: ["build-all-backend"]
  before_script:
    - apt update && apt install -y curl jq sed
    - curl https://cdn.shiftleft.io/download/sl > /usr/local/bin/sl && chmod a+rx /usr/local/bin/sl
    - sed -i 's/\r$//' sl-analysis.sh 
  script:
    - sh sl-analysis.sh
    # Génération du rapport SARIF pour DefectDojo
    - /usr/local/bin/sl check-analysis --app "$CI_PROJECT_NAME-backend" --report --format sarif > qwiet-report.sarif || echo "Scan non disponible"
  artifacts:
    paths: ["qwiet-report.sarif"]

############################################################
# 4️⃣ DEPLOYMENT & RUNTIME SECURITY (FALCO + MONITORING)
############################################################
deploy-to-digitalocean:
  stage: deploy-cloud
  tags: [vm]
  image: dtzar/helm-kubectl:latest
  variables:
    KUBECONFIG: $KUBECONFIG_CONTENT 
  script:
    - kubectl get nodes
    - kubectl apply -f k8s/
    - echo "🕵️ Activation de Falco avec Alerting Slack & DefectDojo..."
    - helm repo add falcosecurity https://falcosecurity.github.io/charts && helm repo update
    - |
      helm upgrade --install falco falcosecurity/falco -n falco --create-namespace \
        --set falcosidekick.enabled=true \
        --set falcosidekick.config.slack.webhookurl="${SLACK_WEBHOOK}" \
        --set falcosidekick.config.slack.minimumpriority="notice" \
        --set falcosidekick.config.defectdojo.url="${DEFECTDOJO_URL}" \
        --set falcosidekick.config.defectdojo.token="${DEFECTDOJO_TOKEN}" \
        --set falcosidekick.config.defectdojo.productid="1"
    - kubectl rollout restart deployment
  only: [main]

owasp-zap-dast:
  stage: dast-scan
  image: 
    name: zaproxy/zap-stable
    entrypoint: [""] # Obligatoire pour outrepasser l'entrypoint par défaut de ZAP
  tags:
     - vm
  before_script:
    - mkdir -p /zap/wrk
  script:
    - echo "🚀 Démarrage des scans DAST sur le Cloud DigitalOcean..."
    
    - echo "1. Scan de l'API Gateway"
    # Note : On n'utilise plus "docker run", on appelle directement le script
    - zap-baseline.py -t http://157.245.22.96 -r zap_gateway_report.html -x zap_gateway_report.xml || true
    
    - echo "2. Scan du Frontend Angular"
    - zap-baseline.py -t http://157.230.77.38 -r zap_frontend_report.html -x zap_frontend_report.xml || true
    
    # TRÈS IMPORTANT : ZAP écrit les rapports dans /zap/wrk/
    # On les copie dans le dossier courant pour que GitLab les trouve
    - cp /zap/wrk/zap_gateway_report.* .
    - cp /zap/wrk/zap_frontend_report.* .
    
  artifacts:
    when: always
    paths:
      - "zap_gateway_report.xml"
      - "zap_frontend_report.xml"
      - "zap_gateway_report.html"
      - "zap_frontend_report.html"
    expire_in: 1 week
  allow_failure: true


############################################################
# 5️⃣ CENTRALISATION FINALE (DEFECTDOJO)
############################################################
upload-all-to-defectdojo:
  stage: upload-defectdojo
  image: alpine:latest
  tags: [vm]
  before_script: [apk add --no-cache curl]
  needs: ["secret-detection", "sca-scan-backend", "owasp-zap-dast", "opa-gatekeeper-check", "qwiet-prezero-scan"]
  script:
    # Upload Secrets
    - |
      if [ -f "gl-secret-report.sarif" ]; then
        curl -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        -F "active=true" -F "verified=true" -F "scan_type=SARIF" -F "product_name=${DD_PRODUCT_NAME}" -F "file=@gl-secret-report.sarif"
      fi
    # Upload Qwiet SAST
    - |
      if [ -f "qwiet-report.sarif" ]; then
        curl -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        -F "active=true" -F "verified=true" -F "scan_type=SARIF" -F "product_name=${DD_PRODUCT_NAME}" -F "file=@qwiet-report.sarif"
      fi
    # Upload OPA
    - |
      if [ -f "opa-report.json" ]; then
        curl -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        -F "active=true" -F "verified=true" -F "scan_type=Conftest Scan" -F "product_name=${DD_PRODUCT_NAME}" -F "file=@opa-report.json"
      fi
    # Upload DAST
    - |
      if [ -f "zap_gateway_report.xml" ]; then
        curl -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        -F "active=true" -F "verified=true" -F "scan_type=ZAP Scan" -F "product_name=${DD_PRODUCT_NAME}" -F "file=@zap_gateway_report.xml"
      fi
  allow_failure: true