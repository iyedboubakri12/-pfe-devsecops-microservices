############################
# VARIABLES GLOBALES
############################
variables:
  GIT_DEPTH: "1"
  SONAR_HOST_URL: "http://192.168.168.129:9000"
  REGISTRY_URL: "registry.gitlab.com"
  MAVEN_CLI_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository --batch-mode"
  DOCKER_DRIVER: overlay2
  

############################
# CACHE
############################
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - frontend/node_modules/

############################
# STAGES
############################
default:
  image: maven:3.8.5-openjdk-17
stages:
  - build-shared
  - test-unitaires
  - security-scan
  - docker-build
  - docker-scan
  - dast-scan


############################
# 1️⃣ INSTALLATION DES MODULES COMMUNS
############################
install-commons:
  stage: build-shared
  image: maven:3.8.5-openjdk-17
  script:
    - cd backend/common-service && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-student && mvn install -DskipTests $MAVEN_CLI_OPTS
    - cd ../common-exam && mvn install -DskipTests $MAVEN_CLI_OPTS
  when: manual  

############################
# 2️⃣ TESTS BACKEND + JACOCO
############################
backend-tests:
  stage: test-unitaires
  tags:
    - vm
  image: maven:3.8.5-openjdk-17
  needs: ["install-commons"]
  script: |
    cd backend
    for service in answer-service api-gateway-service course-service exam-service user-service eureka-service; do
      echo "========== Testing $service =========="
      cd $service
      mvn test $MAVEN_CLI_OPTS -Dspring.profiles.active=test
      cd ..
    done
  artifacts:
    when: always
    paths:
      - backend/**/target/classes
      - backend/**/target/site/jacoco/jacoco.xml
    expire_in: 1 hour
  when: manual  

############################
# 3️⃣ TESTS FRONTEND (ANGULAR)
############################
frontend-tests:
  stage: test-unitaires
  tags:
    - vm
  image: node:18-alpine
  script:
    - cd frontend
    - npm install --legacy-peer-deps
    - npm run test -- --coverage --watchAll=false || true
  artifacts:
    when: always
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 hour
  allow_failure: true
  when: manual

############################
# 4️⃣ SONARQUBE BACKEND
############################
sonarqube-backend:
  stage: security-scan
  tags:
    - vm
  image: maven:3.8.5-openjdk-17
  needs:
  - job: backend-tests
    artifacts: true
  script: |
    cd backend
    for service in user-service exam-service answer-service course-service api-gateway-service eureka-service; do
      echo "========== Sonar Backend : $service =========="
      cd $service
      mvn verify sonar:sonar $MAVEN_CLI_OPTS \
        -Dsonar.projectKey=$service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.java.binaries=target/classes \
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
        || echo "Sonar failed for $service"
      cd ..
    done
  allow_failure: true
sca-scan-backend:
  stage: security-scan
  image: maven:3.8.5-openjdk-17
  needs: ["backend-tests"]
  script:
    - cd backend
    - |
      for dir in api-gateway-service user-service exam-service course-service answer-service; do
        echo "🔍 Scanning $dir..."
        (
          cd $dir && \
          mvn org.owasp:dependency-check-maven:check \
            $MAVEN_CLI_OPTS \
            -Dformat=HTML \
            -DoutputDirectory=target
        ) || echo "SCA failed for $dir"
      done
  artifacts:
    when: always
    paths:
      - backend/**/target/dependency-check-report.html
  allow_failure: true
  when: manual

############################
# 5️⃣ SONARQUBE FRONTEND
############################
sonar-frontend:
  stage: security-scan
  tags:
    - vm
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: ["frontend-tests"]
  script:
    - cd frontend
    - |
      sonar-scanner \
        -Dsonar.projectKey=devsecops-frontend \
        -Dsonar.projectName=devsecops-frontend \
        -Dsonar.projectVersion=$CI_COMMIT_SHORT_SHA \
        -Dsonar.sources=src \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
        -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts
  allow_failure: true
sca-scan-frontend:
  stage: security-scan
  image: node:18-alpine
  needs: ["frontend-tests"]
  script:
    - cd frontend
    - echo "SCA Frontend — Analyse des dépendances NPM (npm audit)"
    - npm ci --legacy-peer-deps
    - npm audit --json > npm-audit-report.json || true
    - npm audit > npm-audit-report.txt || true
    - npm audit --production --audit-level=critical
  artifacts:
    when: always
    paths:
      - frontend/npm-audit-report.json
      - frontend/npm-audit-report.txt
    expire_in: 1 week
  allow_failure: true
  when: manual
############################
# 8️⃣ BUILD backend & PUSH TO REGISTRY (CORRIGÉ)
############################
docker-build-backend:
  stage: docker-build
  tags:
    - vm
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 5; done
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin registry.gitlab.com
  script:
    - cd backend
    - |
      for service in eureka-service course-service api-gateway-service user-service exam-service answer-service; do
        IMAGE="registry.gitlab.com/devsecopsi-group/devsecops-project/$service:latest"
        echo "🚀 Building $service"
        docker build --pull -t $IMAGE ./$service
        docker push $IMAGE
      done
  when: manual
  ############################
# 8️⃣ BUILD frontend & PUSH TO REGISTRY (CORRIGÉ)
############################     
docker-build-frontend:
  stage: docker-build
  tags:
    - vm
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 5; done
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin registry.gitlab.com
  script:
    - cd frontend
    - IMAGE="registry.gitlab.com/devsecopsi-group/devsecops-project/frontend:latest"
    - echo "🚀 Building frontend"
    - docker build --pull -t $IMAGE .
    - docker push $IMAGE
  when: manual
############################
# 9️⃣ SCAN DES IMAGES AVEC TRIVY
############################
container_scan:
  stage: docker-scan
  tags:
    - vm
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - docker-build-backend
    - docker-build-frontend

  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    TRIVY_TIMEOUT: "10m"

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - mkdir -p reports/
    - |
      REGISTRY="registry.gitlab.com/devsecopsi-group/devsecops-project"

      for service in eureka-service course-service api-gateway-service user-service exam-service answer-service frontend; do
        IMAGE="$REGISTRY/$service:latest"
        echo "🛡️ Scanning $IMAGE..."

        trivy image \
          --username gitlab-ci-token \
          --password $CI_JOB_TOKEN \
          --severity HIGH,CRITICAL \
          --format template \
          --template "@/contrib/html.tpl" \
          --output "reports/${service}-report.html" \
          $IMAGE || true

        trivy image \
          --username gitlab-ci-token \
          --password $CI_JOB_TOKEN \
          --severity HIGH,CRITICAL \
          --format json \
          --output "reports/${service}-report.json" \
          $IMAGE || true
      done

  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

  only:
    - main

  when: manual
secret-detection:
  stage: security-scan
  tags:
    - vm
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - echo "🔍 Analyse du dépôt à la recherche de secrets..."
    # On scanne tout l'historique du projet
    - gitleaks detect --source . --redact --report-format sarif --report-path gl-secret-report.sarif
  artifacts:
    expire_in: 1 week
    reports:
      sast: gl-secret-report.sarif
  allow_failure: true
  when: manual

zap_scan:
  stage: dast-scan
  image: docker.io/zaproxy/zap-stable
  script:
    - mkdir -p zap-reports
    - echo "Scan API Gateway"
    - docker run --rm \
        -v $CI_PROJECT_DIR/zap-reports:/zap/wrk \
        --network container:api-gateway-service \
        docker.io/zaproxy/zap-stable \
        zap-baseline.py -t http://api-gateway:8090 -r /zap/wrk/zap_api_report.html -J /zap/wrk/zap_api_report.json
    - echo "Scan Frontend"
    - docker run --rm \
        -v $CI_PROJECT_DIR/zap-reports:/zap/wrk \
        --network container:frontend \
        docker.io/zaproxy/zap-stable \
        zap-baseline.py -t http://frontend:80 -r /zap/wrk/zap_frontend_report.html -J /zap/wrk/zap_frontend_report.json
  artifacts:
    paths:
      - zap-reports/
  when: manual
  
  