server:
  port: 8084
spring:
  application:
    name: exam-service
  datasource:
    # On utilise une variable qui peut être écrasée par Kubernetes
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_microservices_exams?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      # On utilise la variable que Kubernetes va envoyer
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
