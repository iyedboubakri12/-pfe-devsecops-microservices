server.port=8090
eureka.client.serviceUrl.defaultZone = http://eureka-service:8761/eureka
spring.application.name=api-gateway-service
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-core
spring.cloud.gateway.routes[0].uri=lb://USERS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/students/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# COURSE SERVICE (Nom corrigé sans S)
spring.cloud.gateway.routes[1].id=course-core
spring.cloud.gateway.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# EXAM SERVICE
spring.cloud.gateway.routes[2].id=exams-core
spring.cloud.gateway.routes[2].uri=lb://EXAM-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/exams/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# ANSWER SERVICE
spring.cloud.gateway.routes[3].id=answer-core
spring.cloud.gateway.routes[3].uri=lb://ANSWER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/answers/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# --- CONFIGURATION MONITORING (ACTUATOR) ---
# Autorise Prometheus à lire les données du service
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.prometheus.enabled=true

# Permet d'avoir des noms de métriques clairs dans Grafana
management.metrics.tags.application=${spring.application.name}





