# 1. USER-SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
      - name: user-service
        image: registry.gitlab.com/devsecopsi-group/devsecops-project/user-service:latest
        securityContext:      # <--- IL FAUT LE METTRE ICI (DANS LE CONTAINER)
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false # Optionnel mais recommandé
        ports:
        - containerPort: 8081
        env:
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
          value: "/students/actuator"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/microservices_db
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://eureka-service:8761/eureka/
        resources:
          limits: { memory: "512Mi" }
          requests: { memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels: { app: user-service }
spec:
  selector: { app: user-service }
  ports: [{ name: http-web, port: 8081, targetPort: 8081 }]
---

# 2. COURSE-SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
spec:
  replicas: 1
  selector: { matchLabels: { app: course-service } }
  template:
    metadata: { labels: { app: course-service } }
    spec:
      imagePullSecrets: [{ name: gitlab-registry-secret }]
      containers:
      - name: course-service
        image: registry.gitlab.com/devsecopsi-group/devsecops-project/course-service:latest
        securityContext:      # <--- DANS LE CONTAINER
          runAsNonRoot: true
          runAsUser: 1000
        ports: [{ containerPort: 8082 }]
        env:
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "true"
        - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
          value: "/courses/actuator"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/microservices_db
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: root
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://eureka-service:8761/eureka/
        resources:
          limits: { memory: "512Mi" }
          requests: { memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  labels: { app: course-service }
spec:
  selector: { app: course-service }
  ports: [{ name: http-web, port: 8082, targetPort: 8082 }]
---

