apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
      - name: frontend
        image: registry.gitlab.com/devsecopsi-group/devsecops-project/frontend:latest
        ports:
        - containerPort: 8080
        # --- SÉCURITÉ AU NIVEAU DU CONTENEUR (Validé par OPA) ---
        securityContext:
          runAsNonRoot: true    # <--- La règle OPA cherche cette ligne précise ICI
          runAsUser: 101        # <--- On définit l'utilisateur 101 (Nginx)
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # -------------------------------------------------------
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
      volumes:
      - name: tmp-volume
        emptyDir: {}
---


apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer 
  selector:
    app: frontend
  ports:
    - port: 80        # Port d'entrée public DigitalOcean
      targetPort: 8080 # Envoie vers le port sécurisé d
